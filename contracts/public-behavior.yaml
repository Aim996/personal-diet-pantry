  - preview_add
  - commit_add
  - query
  - search
  - adjust
  - deduct
  - discard
  - open
  - freeze
  - thaw
  - preview_update_metadata
  - commit_update_metadata
  - preview_link_nutrition
  - commit_link_nutrition
